<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="THEM 1947 - Grey-series 3D prints and classified case files." />
    <title>THEM 1947</title>
    <link rel="icon" href="/assets/brand/logo.png" type="image/png" />
    <link rel="stylesheet" href="/assets/css/landing.css" />
    <link rel="canonical" href="https://them1947.com/" />
    <meta property="og:title" content="THEM 1947" />
    <meta property="og:description" content="Grey-series 3D prints and classified case files." />
    <meta property="og:url" content="https://them1947.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://them1947.com/assets/video/landing-poster.jpg" />
  </head>
  <body>
    <main class="landing" aria-label="THEM 1947">
      <video
        id="intro-video"
        class="landing-video is-dormant"
        playsinline
        webkit-playsinline
        preload="metadata"
        poster="/assets/video/landing-poster.jpg"
        disablePictureInPicture
        controlslist="nodownload nofullscreen noremoteplayback"
      >
        <source src="/assets/video/landing.mp4" type="video/mp4" />
      </video>

      <video
        id="brief-video"
        class="landing-video is-dormant"
        playsinline
        webkit-playsinline
        preload="metadata"
        disablePictureInPicture
        controlslist="nodownload nofullscreen noremoteplayback"
      >
        <source src="/assets/video/classified-brief.mp4" type="video/mp4" />
      </video>

      <img
        id="landing-poster"
        class="landing-poster is-visible"
        src="/assets/video/landing-poster.jpg"
        alt=""
      />

      <div id="landing-scrim" class="landing-scrim" aria-hidden="true"></div>

      <div id="start-overlay" class="start-overlay">
        <button id="start-btn" class="start-btn" type="button">
          <img class="start-logo" src="/assets/brand/logo.png" alt="" />
          <span class="start-label">Tap to begin</span>
          <span class="start-hint">Two transmissions play first</span>
        </button>
      </div>

      <img
        id="landing-logo"
        class="landing-logo"
        src="/assets/brand/logo.png"
        alt="THEM 1947"
      />

      <div id="landing-ui" class="landing-ui">
        <button
          id="classified-folder"
          class="classified-folder"
          type="button"
          disabled
          aria-disabled="true"
          aria-label="Open classified archive"
        >
          <span class="folder-body">
            <span class="folder-tab"></span>
            <span class="folder-stamp">Classified</span>
          </span>
        </button>
        <div class="landing-banner-row">
          <a
            id="landing-commercial-btn"
            class="commercial-membership-landing-btn"
            href="https://makerworld.com/en/@user_935464230#commercial-membership-open"
            target="_blank"
            rel="noopener"
            hidden
            aria-hidden="true"
          >
            Join Commercial Membership
          </a>
          <button
            id="terminal-access-btn"
            class="terminal-access-btn"
            type="button"
            hidden
            aria-hidden="true"
            disabled
          >
            Terminal access
          </button>
        </div>
      </div>

      <footer id="landing-footer" class="landing-footer">
        <a id="landing-commercial-link" href="https://makerworld.com/en/@user_935464230#commercial-membership-open" target="_blank" rel="noopener">Commercial Membership</a>
        <a href="/contact/">Contact</a>
        <a href="/privacy/">Privacy</a>
        <a href="/terms/">Terms</a>
      </footer>
    </main>

    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/landing.js"></script>
  </body>
</html>
