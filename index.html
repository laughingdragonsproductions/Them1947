<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="THEM 1947 — classified transmissions incoming. Coming soon." />
    <title>THEM 1947 — Coming Soon</title>
    <link rel="icon" href="/assets/brand/logo.png" type="image/png" />
    <link rel="stylesheet" href="/assets/css/landing.css" />
    <link rel="canonical" href="https://them1947.com/" />
    <meta property="og:title" content="THEM 1947" />
    <meta property="og:description" content="Classified transmissions incoming. Coming soon." />
    <meta property="og:url" content="https://them1947.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://them1947.com/assets/video/landing-poster.jpg" />
  </head>
  <body>
    <main class="landing" aria-label="THEM 1947 coming soon">
      <video
        id="intro-video"
        class="landing-video is-dormant"
        playsinline
        webkit-playsinline
        preload="metadata"
        poster="/assets/video/landing-poster.jpg"
        disablePictureInPicture
        controlslist="nodownload nofullscreen noremoteplayback"
      >
        <source src="/assets/video/landing.mp4" type="video/mp4" />
      </video>

      <video
        id="brief-video"
        class="landing-video is-dormant"
        playsinline
        webkit-playsinline
        preload="metadata"
        disablePictureInPicture
        controlslist="nodownload nofullscreen noremoteplayback"
      >
        <source src="/assets/video/classified-brief.mp4" type="video/mp4" />
      </video>

      <img
        id="landing-poster"
        class="landing-poster is-visible"
        src="/assets/video/landing-poster.jpg"
        alt=""
      />

      <div id="dossier-stage" class="dossier-stage" hidden aria-hidden="true">
        <div class="dossier-table" aria-hidden="true"></div>
        <img
          id="dossier-clue"
          class="dossier-clue"
          src="/assets/brand/mainfile-dossier.png"
          alt=""
          draggable="false"
        />
      </div>

      <div id="landing-scrim" class="landing-scrim" aria-hidden="true"></div>

      <div id="start-overlay" class="start-overlay">
        <button id="start-btn" class="start-btn" type="button">
          <img class="start-logo" src="/assets/brand/logo.png" alt="" />
          <span class="start-label">Tap to begin</span>
          <span class="start-hint">Two transmissions play first</span>
        </button>
      </div>

      <img
        id="landing-logo"
        class="landing-logo"
        src="/assets/brand/logo.png"
        alt="THEM 1947"
      />

      <div id="landing-ui" class="landing-ui">
        <button
          id="classified-folder"
          class="classified-folder"
          type="button"
          disabled
          aria-disabled="true"
          aria-label="Open classified archive"
        >
          <span class="folder-body">
            <span class="folder-tab"></span>
            <span class="folder-stamp">Classified</span>
          </span>
        </button>
        <div class="landing-banner-row">
          <p class="coming-soon">Coming soon</p>
          <button
            id="bypass-btn"
            class="bypass-btn"
            type="button"
            hidden
            aria-hidden="true"
          >
            Terminal access
          </button>
        </div>
        <div id="bypass-bar" class="bypass-bar" hidden aria-hidden="true">
          <form id="bypass-form" class="bypass-form" autocomplete="off">
            <label class="bypass-label" for="bypass-input">Clearance code · read the dossier</label>
            <div class="bypass-input-row">
              <input
                id="bypass-input"
                class="bypass-input"
                type="text"
                name="clearance"
                autocomplete="off"
                spellcheck="false"
                maxlength="32"
                disabled
              />
              <button id="bypass-submit" class="bypass-submit" type="submit" disabled>
                Access
              </button>
            </div>
          </form>
          <p id="bypass-status" class="bypass-status" aria-live="polite"></p>
        </div>
      </div>

      <footer id="landing-footer" class="landing-footer">
        <a href="/contact/">Contact</a>
        <a href="/privacy/">Privacy</a>
        <a href="/terms/">Terms</a>
      </footer>
    </main>

    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/site-gate.js"></script>
    <script src="/assets/js/landing.js"></script>
  </body>
</html>
