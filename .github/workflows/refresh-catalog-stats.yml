name: Refresh MakerWorld catalog stats

on:
  schedule:
    - cron: "0 11 1,15 * *" # Bi-weekly ~7am Eastern (1st and 15th)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/pull-makerworld-catalog.py --stats-only
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/catalog-data.js
          git diff --staged --quiet && echo "No catalog stats changes" && exit 0
          git commit -m "chore: refresh MakerWorld catalog stats"
          git push
