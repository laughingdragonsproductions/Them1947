<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="refresh" content="5;url=https://www.google.com/" />
    <title>404 — Signal lost</title>
    <link rel="icon" href="/assets/brand/logo.png" type="image/png" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #05070c;
        color: #e8eef4;
        font-family: "Segoe UI", system-ui, sans-serif;
        text-align: center;
      }
      .panel {
        width: min(100%, 420px);
        padding: 2rem 1.5rem;
        border: 1px solid rgba(126, 184, 212, 0.35);
        border-radius: 6px;
        background: rgba(8, 12, 20, 0.92);
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.45);
      }
      .code {
        margin: 0 0 0.5rem;
        font: 700 3rem "Courier New", Courier, monospace;
        letter-spacing: 0.08em;
        color: #7eb8d4;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.1rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      p {
        margin: 0;
        color: rgba(232, 238, 244, 0.72);
        line-height: 1.5;
      }
      .hint {
        margin-top: 1.25rem;
        font: 0.72rem "Courier New", Courier, monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(224, 122, 122, 0.9);
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <p class="code">404</p>
      <h1>Clearance revoked</h1>
      <p>Too many failed attempts. This transmission has been terminated and your session flagged.</p>
      <p class="hint">Redirecting…</p>
    </div>
  </body>
</html>
