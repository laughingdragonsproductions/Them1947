<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="About THEM 1947 — classified Grey-series 3D prints and digital files." />
    <title>About</title>
    <link rel="icon" href="/assets/brand/logo.png" type="image/png" />
    <link rel="stylesheet" href="/assets/css/site.css" />
    <link rel="canonical" href="https://them1947.com/about/" />
  </head>
  <body>
    <div id="app"></div>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/site-gate.js"></script>
    <script src="/assets/js/site.js"></script>
    <script>
      if (SiteGate.requireAccess()) {
        initPage({
          title: "About",
          description: "About THEM 1947 — classified Grey-series 3D prints and digital files.",
          activePath: "/about/",
          content: `
          <header class="page-header reveal">
            <p class="pillar-eyebrow">Case file</p>
            <h1>THEM 1947</h1>
            <p>A classified archive of Grey-series 3D prints and digital files. The landing transmission is live. The catalog is almost live. The files themselves are not.</p>
          </header>
          <div class="prose reveal">
            <p><strong>THEM 1947</strong> is the name on the circular badge: UFO silhouette, stencil wordmark, year 1947. The work is a line of classic Greys — large almond eyes, elongated figures, night terrain — plus the digital kits that help people photograph and paint them.</p>
            <p>them1947.com is the briefing room. The cinematic landing stays the front door. The classified folder opens this archive. Every listing currently shows the logo under a classified stamp instead of product photography. Checkout is off on purpose.</p>
            <h2>What we publish</h2>
            <ul>
              <li><strong>3D prints</strong> — STL/3MF Grey figures, terrain, craft, and badges when declassified</li>
              <li><strong>Digital files</strong> — reference sheets, stencils, and photography packs</li>
            </ul>
            <p>We do not run games, kids programming, or apparel on this domain. That work lives elsewhere in the studio network.</p>
            <h2>Contact</h2>
            <p>Press, collaborations, or declassification questions: use the <a href="/contact/">Contact</a> form. We do not publish a raw email address on this site.</p>
            <h2>How to read a classified listing</h2>
            <p>Each card is a shop-shaped listing: name, category, a short spec, and a stamp over the THEM 1947 badge instead of a product photo. Opening a card shows the intended scale or file type and a disabled purchase control. “Request when cleared” goes to Contact. Nothing on this domain currently completes a sale.</p>
            <p>When a file is declassified, the same URL keeps the listing, swaps the stamp for photography, and adds a real buy or download path. Until that batch, assume every mesh and every PDF is still in the folder. The landing video, the badge, and the night still are the public face of the line; the archive is the inventory waiting for clearance.</p>
          </div>
        `,
        });
      }
    </script>
  </body>
</html>
